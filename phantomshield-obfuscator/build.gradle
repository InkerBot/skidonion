plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

sourceCompatibility = targetCompatibility = '1.8'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/groups/public/" } // SnakeYAML
}

dependencies {
    implementation project(':phantomshield-annotations')

    implementation 'info.picocli:picocli:4.6.3'

    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-tree:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'

    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.1'
}

jar {
    manifest.attributes([
            'Main-Class': 'tech.skidonion.obfuscator.cli.Main',
            'Class-Path': buildClassPath(),
    ])
}

processResources.dependsOn(':phantomshield-loader:copyToObfuscator')

task copyDenpendecies(type: Copy) {
    from configurations.runtimeClasspath
    into 'libs'
}

test {
    useJUnitPlatform()
}

String buildClassPath() {
    StringBuilder path = new StringBuilder()
    configurations.runtimeClasspath.each {
        path.append("libs//").append(it.name).append(" ");
    }
    return path.toString()
}