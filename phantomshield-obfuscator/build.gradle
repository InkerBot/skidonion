plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

project.ext.lwjglVersion = "3.3.3"
project.ext.lwjglNatives = "natives-windows"

sourceCompatibility = targetCompatibility = '1.8'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/groups/public/" } // SnakeYAML
}

dependencies {
    implementation project(':phantomshield-annotations')
    implementation project(':phantomshield-inline')
    implementation project(":phantomshield-jphantom")

    implementation 'info.picocli:picocli:4.6.3'

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-nanovg"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.ow2.asm:asm-analysis:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'

    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.google.guava:guava:33.1.0-jre'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.1'
}

jar {
    manifest.attributes([
            'Main-Class': 'tech.skidonion.obfuscator.cli.Main',
            'Class-Path': buildClassPath(),
    ])
}

processResources.dependsOn(':phantomshield-loader:copyToObfuscator')
processResources.dependsOn(':phantomshield-verification:copyToObfuscator')
processResources.dependsOn(':phantomshield-bench:copyToInput')

task copyDenpendecies(type: Copy) {
    from configurations.runtimeClasspath
    into 'libs'
}

test {
    useJUnitPlatform()
}

String buildClassPath() {
    StringBuilder path = new StringBuilder()
    configurations.runtimeClasspath.each {
        path.append("libs//").append(it.name).append(" ");
    }
    return path.toString()
}